<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaza Takibi</title>
<meta name="theme-color" content="#1F2A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kaza Takibi">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#1a2230; --muted:#5d6878; --line:#d5dbe3;
  --accent:#1f6f78; --accent-ink:#ffffff; --soft:#e3e8ee; --warn:#a2402c; --warn-soft:#f7e6e1;
  --ok-soft:#e1efef;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#171e27; --ink:#e6ebf1; --muted:#93a0b0; --line:#28323e;
    --accent:#5bb8c0; --accent-ink:#06282b; --soft:#1f2833; --warn:#e3876f; --warn-soft:#35211c;
    --ok-soft:#15292c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --ink:#e6ebf1; --muted:#93a0b0; --line:#28323e;
  --accent:#5bb8c0; --accent-ink:#06282b; --soft:#1f2833; --warn:#e3876f; --warn-soft:#35211c;
  --ok-soft:#15292c;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:16px; line-height:1.45;
}
.wrap{max-width:560px; margin:0 auto; padding:20px 16px calc(96px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* Head */
.head{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
h1{font-size:1.05rem; font-weight:600; margin:0; color:var(--muted)}
.status{font-size:.8rem; color:var(--muted)}
.total{margin:10px 0 2px; font-size:clamp(2.6rem, 12vw, 3.6rem); font-weight:800; letter-spacing:-.03em; line-height:1}
.total small{font-size:1rem; font-weight:500; letter-spacing:0; color:var(--muted); margin-left:6px}
.sub{color:var(--muted); font-size:.92rem; margin:6px 0 0}
.bigbar{height:8px; border-radius:4px; background:var(--soft); overflow:hidden; margin:14px 0 4px}
.bigbar i{display:block; height:100%; background:var(--accent); width:0; transition:width .3s}
.hint{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:.88rem; color:var(--muted); margin-top:14px}
.hint button.link{border:0; background:none; padding:0; color:var(--accent); font-weight:600; text-decoration:underline}

/* Kerahat şeridi */
.vakit{display:flex; gap:10px; align-items:center; margin-top:16px; padding:10px 12px; border-radius:10px; background:var(--ok-soft); border:0; width:100%; text-align:left; font-size:.9rem}
.vakit .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none}
.vakit b{font-weight:700}
.vakit span.r{margin-left:auto; color:var(--muted); font-size:.8rem; white-space:nowrap}
.vakit.warn{background:var(--warn-soft)}
.vakit.warn .dot{background:var(--warn)}
.vakit.warn b{color:var(--warn)}

.dayBtn{
  width:100%; margin:14px 0 6px; padding:15px 16px; border:0; border-radius:12px;
  background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:1.02rem;
}
.dayBtn:active{transform:scale(.99)}
.dayBtn:disabled{opacity:.45}
.dayNote{font-size:.82rem; color:var(--muted); text-align:center; margin:0 0 18px}

/* Vakit rows */
.list{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.row{display:grid; grid-template-columns:44px 1fr auto; gap:12px; align-items:center; padding:12px; border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.sky{width:44px; height:44px; border-radius:10px; position:relative; overflow:hidden}
.sky::after{content:""; position:absolute; left:0; right:0; bottom:0; height:30%; background:rgba(10,14,24,.28)}
.sky b{position:absolute; border-radius:50%}
.name{font-weight:600}
.count{font-size:.86rem; color:var(--muted)}
.count strong{color:var(--ink); font-size:1.05rem; font-weight:700}
.bar{height:5px; border-radius:3px; background:var(--soft); overflow:hidden; margin-top:6px}
.bar i{display:block; height:100%; width:0; transition:width .3s}
.btns{display:flex; gap:6px}
.minus{width:40px; height:44px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--muted); font-size:1.2rem}
.plus{height:44px; padding:0 14px; border-radius:10px; border:1px solid var(--accent); background:transparent; color:var(--accent); font-weight:700; white-space:nowrap}
.plus:disabled, .minus:disabled{opacity:.35; cursor:default}
.row.flash .plus{background:var(--accent); color:var(--accent-ink)}
.row.doneRow .name::after{content:" tamamlandı"; font-weight:500; font-size:.8rem; color:var(--accent)}
.addOruc{display:block; width:100%; margin-top:10px; padding:11px; border-radius:12px; border:1px dashed var(--line); background:transparent; color:var(--muted); font-size:.9rem}

/* sky palettes */
.s-sabah{background:linear-gradient(180deg,#34427a 0%,#9b7fb0 55%,#f0b3a0 100%)}
.s-ogle{background:linear-gradient(180deg,#3d9ee0 0%,#8fcdf3 60%,#dff2ff 100%)}
.s-ikindi{background:linear-gradient(180deg,#e9b458 0%,#f0c982 50%,#e7925a 100%)}
.s-aksam{background:linear-gradient(180deg,#5b3576 0%,#c2506a 55%,#f08a4f 100%)}
.s-yatsi{background:linear-gradient(180deg,#0f1433 0%,#1f2a5c 70%,#2c3a70 100%)}
.s-vitir{background:linear-gradient(180deg,#070918 0%,#1a1740 70%,#2e2860 100%)}
.s-oruc{background:linear-gradient(180deg,#1b2350 0%,#6d4f8f 60%,#e39a6b 100%)}
.fill-sabah{background:linear-gradient(90deg,#34427a,#f0b3a0)}
.fill-ogle{background:linear-gradient(90deg,#3d9ee0,#8fcdf3)}
.fill-ikindi{background:linear-gradient(90deg,#e9b458,#e7925a)}
.fill-aksam{background:linear-gradient(90deg,#5b3576,#f08a4f)}
.fill-yatsi{background:linear-gradient(90deg,#1f2a5c,#4a5ca6)}
.fill-vitir{background:linear-gradient(90deg,#2e2860,#6b5fb8)}
.fill-oruc{background:linear-gradient(90deg,#6d4f8f,#e39a6b)}

/* Panels */
h2{font-size:1rem; margin:28px 0 10px; font-weight:700}
h2:first-child{margin-top:4px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px}
.panel + .panel{margin-top:10px}
.today{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.today strong{font-size:1.5rem; font-weight:800}
.bars{display:flex; align-items:flex-end; gap:4px; height:78px; margin-top:14px}
.bars div{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; min-width:0}
.bars span{display:block; width:100%; max-width:22px; border-radius:3px 3px 0 0; background:var(--accent); min-height:2px}
.bars span.zero{background:var(--soft)}
.bars span.met{background:var(--accent)}
.bars span.part{background:var(--line); background:color-mix(in srgb, var(--accent) 45%, var(--soft))}
.bars em{font-style:normal; font-size:.62rem; color:var(--muted); white-space:nowrap}
.eta{margin-top:12px; font-size:.9rem; color:var(--muted)}
.eta b{color:var(--ink)}

/* İstatistik */
.streak{display:flex; align-items:center; gap:16px}
.streak .big{font-size:2.6rem; font-weight:800; line-height:1; letter-spacing:-.02em}
.streak .lbl{color:var(--muted); font-size:.9rem}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:14px; text-align:center}
.week i{display:block; height:28px; border-radius:8px; background:var(--soft)}
.week i.met{background:var(--accent)}
.week i.part{background:var(--line); background:color-mix(in srgb, var(--accent) 35%, var(--soft))}
.week i.now{outline:2px solid var(--accent); outline-offset:-2px}
.week em{font-style:normal; font-size:.7rem; color:var(--muted); display:block; margin-top:3px}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
.tile b{display:block; font-size:1.5rem; font-weight:800; line-height:1.15}
.tile span{font-size:.82rem; color:var(--muted)}
.miles{list-style:none; margin:0; padding:0}
.miles li{display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--line); font-size:.92rem}
.miles li:first-child{border-top:0}
.miles .m{width:46px; height:26px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.82rem; background:var(--soft); color:var(--muted); flex:none}
.miles li.got .m{background:var(--accent); color:var(--accent-ink)}
.miles li.next .m{outline:2px solid var(--accent); outline-offset:-2px; color:var(--accent)}
.miles small{margin-left:auto; color:var(--muted); font-size:.8rem; text-align:right}

/* Oturum */
.seg{display:grid; grid-template-columns:1fr 1fr; background:var(--soft); border-radius:10px; padding:3px; gap:3px}
.seg button{border:0; background:transparent; padding:9px; border-radius:8px; font-weight:600; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stepper{display:flex; align-items:center; gap:6px}
.stepper button{width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:transparent; font-size:1.2rem}
.stepper output{min-width:36px; text-align:center; font-weight:700; font-size:1.1rem}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.chips button{border:1px solid var(--line); background:transparent; border-radius:18px; padding:6px 12px; font-size:.9rem}
.chips button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.run{text-align:center; padding:6px 0 0}
.run .prog{color:var(--muted); font-size:.88rem}
.run .pname{font-size:2.3rem; font-weight:800; margin:8px 0 2px; letter-spacing:-.02em}
.run .pk{color:var(--muted); font-size:.9rem}
/* Zikirmatik */
.zlist{display:flex; flex-wrap:wrap; gap:6px; padding:2px; margin:12px -2px 0}
.libBtn{display:flex; align-items:center; gap:10px; width:100%; margin-top:14px; padding:13px 14px; border:1px solid var(--accent); border-radius:12px; background:var(--surface); color:var(--ink); text-align:left}
.libBtn b{font-weight:700}
.libBtn span.sub{display:block; font-size:.8rem; color:var(--muted); font-weight:400}
.libBtn .go{margin-left:auto; color:var(--accent); font-weight:700; white-space:nowrap}
.zlist button{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:18px; padding:7px 13px; font-size:.9rem; white-space:nowrap}
.zlist button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.zname{text-align:center; margin:14px 0 0; font-size:1.25rem; font-weight:700; line-height:1.3}
.zsub{text-align:center; color:var(--muted); font-size:.86rem; margin:2px 0 0}
.stages{display:flex; justify-content:center; gap:8px; margin-top:8px}
.stages span{font-size:.75rem; padding:3px 9px; border-radius:10px; background:var(--soft); color:var(--muted)}
.stages span.on{background:var(--accent); color:var(--accent-ink)}
.stages span.ok{color:var(--accent)}
.zbtn{display:block; width:min(76vw, 290px); aspect-ratio:1; margin:18px auto 0; border:0; border-radius:50%; padding:14px;
  background:conic-gradient(var(--accent) var(--p,0%), var(--soft) 0); -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none}
.zbtn .in{width:100%; height:100%; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:inset 0 0 0 1px var(--line)}
.zbtn:active .in{background:var(--ok-soft)}
.zbtn b{font-size:clamp(3.4rem, 18vw, 4.6rem); font-weight:800; line-height:1; letter-spacing:-.03em}
.zbtn small{color:var(--muted); font-size:.95rem; margin-top:6px}
.zbtn em{font-style:normal; color:var(--accent); font-size:.85rem; font-weight:700; margin-top:4px; min-height:1.2em}
.ztoday{text-align:center; color:var(--muted); font-size:.85rem; margin:12px 0 0}
.addRow{display:flex; gap:8px; margin-top:10px}
.addRow input{flex:1; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:0}
.addRow button{border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); border-radius:8px; padding:0 14px; font-weight:600}
.niyet{font-size:.92rem; background:var(--bg); border-radius:10px; padding:10px 12px; margin:14px 0 0; text-align:left}
.tapBtn{width:100%; min-height:120px; margin-top:16px; border:0; border-radius:18px; background:var(--accent); color:var(--accent-ink); font-size:1.2rem; font-weight:800; padding:16px}
.tapBtn:active{transform:scale(.985)}
.ghostRow{display:flex; gap:8px; margin-top:10px}
.ghostRow button{flex:1; padding:11px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--muted); font-weight:600}
.queue{display:flex; gap:4px; flex-wrap:wrap; justify-content:center; margin-top:14px}
.queue i{width:10px; height:10px; border-radius:3px; background:var(--soft)}
.queue i.ok{background:var(--accent)}
.queue i.sk{background:var(--line)}
.queue i.cur{background:transparent; outline:2px solid var(--accent); outline-offset:-2px}

/* Bugün kılınanlar */
.tally{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.tally span{display:inline-flex; align-items:center; gap:6px; background:var(--bg); border-radius:18px; padding:5px 11px; font-size:.86rem}
.tally span i{width:8px; height:8px; border-radius:50%; flex:none}
.tally span b{font-weight:700}
.tally .none{color:var(--muted); background:transparent; padding-left:0}

/* Güncelleme şeridi */
.upd{display:flex; gap:10px; align-items:center; background:var(--ok-soft); border:1px solid var(--accent); border-radius:12px; padding:12px; margin-top:14px; font-size:.9rem}
.upd b{display:block}
.upd .small{margin:2px 0 0}
.upd .go{border:0; background:var(--accent); color:var(--accent-ink); border-radius:9px; padding:9px 14px; font-weight:700; white-space:nowrap}
.upd .x{border:0; background:none; color:var(--muted); font-size:1.2rem; line-height:1; padding:0 2px}
.updbar{height:5px; border-radius:3px; background:var(--soft); overflow:hidden; margin-top:8px}
.updbar i{display:block; height:100%; background:var(--accent); transition:width .2s}

/* Vird */
.seg.three{grid-template-columns:1fr 1fr 1fr}
.vcard{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:10px}
.vcard .vh{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.vcard b{font-size:1.02rem}
.vcard .vd{color:var(--muted); font-size:.85rem; white-space:nowrap}
.vcard .bar{margin-top:10px}
.vgrid{display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin-top:14px}
.vgrid i{aspect-ratio:1; border-radius:5px; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:.6rem; color:var(--muted); font-style:normal}
.vgrid i.ok{background:var(--accent); color:var(--accent-ink)}
.vgrid i.miss{background:var(--warn-soft); color:var(--warn)}
.vgrid i.now{outline:2px solid var(--accent); outline-offset:-2px; color:var(--accent)}
.step{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px}
.step.done{border-color:var(--accent)}
.step .sh{display:flex; align-items:center; gap:10px; font-weight:700}
.step .sn{width:26px; height:26px; border-radius:50%; background:var(--soft); color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:.85rem; flex:none}
.step.done .sn{background:var(--accent); color:var(--accent-ink)}
.ayet > div{padding:10px 0; border-top:1px solid var(--line)}
.ayet > div:first-child{border-top:0; padding-top:4px}
.ayet .arabic{margin:0}
.ayet .trans{margin:6px 0 0; color:var(--muted); font-size:.9rem}
.arabic{direction:rtl; text-align:right; font-size:1.45rem; line-height:2.1; margin:12px 0 0; font-family:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif}
.trans{font-size:.95rem; line-height:1.7; margin:12px 0 0}
.meal{font-size:.92rem; color:var(--muted); line-height:1.6; margin:10px 0 0}
.vdone{text-align:center; padding:18px 0 4px}
.vdone b{display:block; font-size:2.2rem; font-weight:800; line-height:1.1}
.vpick{display:block; width:100%; text-align:left; margin-top:10px; padding:14px; border-radius:14px; border:1px solid var(--line); background:var(--surface)}
.vpick b{display:block; font-size:1rem}
.vpick span{color:var(--muted); font-size:.85rem}

/* Rehber */
.prose h3{font-size:.98rem; margin:0 0 6px}
.prose p, .prose li{font-size:.93rem}
.prose p{margin:6px 0}
.prose ul{margin:6px 0; padding-left:20px}
.prose blockquote{margin:8px 0; padding:8px 12px; background:var(--bg); border-radius:8px; font-size:.93rem}
.times{width:100%; border-collapse:collapse; font-size:.93rem}
.times td{padding:6px 0; border-top:1px solid var(--line)}
.times tr:first-child td{border-top:0}
.times td:last-child{text-align:right; font-weight:600}
.times tr.kr td{color:var(--warn)}
.times tr.nowrow td{font-weight:800}

/* Settings */
details{background:var(--surface); border:1px solid var(--line); border-radius:14px}
details + details{margin-top:10px}
summary{padding:14px; font-weight:700; cursor:pointer; list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+"; float:right; color:var(--muted); font-weight:500}
details[open] summary::after{content:"−"}
.set{padding:0 14px 16px}
.field{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--line)}
.field label{font-size:.92rem}
.field .help{display:block; font-size:.78rem; color:var(--muted)}
input[type=date], input[type=number], input[type=time], select, textarea{
  font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line);
  border-radius:8px; padding:7px 9px; min-width:0;
}
input[type=number]{width:96px; text-align:right}
input[type=checkbox]{width:22px; height:22px; accent-color:var(--accent); flex:none}
textarea{width:100%; min-height:90px; font-size:.8rem; margin-top:8px}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-top:8px}
.grid label{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.88rem; background:var(--bg); border-radius:8px; padding:6px 6px 6px 10px}
.grid input{width:84px; background:var(--surface)}
.subh{font-size:.92rem; font-weight:600; margin:16px 0 2px}
.small{font-size:.8rem; color:var(--muted); margin:4px 0 0}
.small.warnTxt{color:var(--warn)}
.act{margin-top:12px; width:100%; padding:11px; border-radius:10px; border:1px solid var(--accent); background:transparent; color:var(--accent); font-weight:600}
.act.fill{background:var(--accent); color:var(--accent-ink)}
.act:disabled{opacity:.4}
.two{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.two .act{margin-top:10px}
.danger{border-color:var(--warn); color:var(--warn)}
.danger.armed{background:var(--warn); color:var(--surface)}
.importBox{border:2px solid var(--accent); border-radius:14px; padding:14px; margin-bottom:12px; background:var(--surface)}
.importBox p{margin:4px 0; font-size:.92rem}

/* Kurulum */
.ob{padding-top:8px}
.obTop{display:flex; align-items:center; justify-content:space-between; gap:10px}
.obDots{display:flex; gap:6px}
.obDots i{width:22px; height:5px; border-radius:3px; background:var(--soft)}
.obDots i.on{background:var(--accent)}
.obStep{font-size:.82rem; color:var(--muted)}
.ob h2{font-size:1.5rem; line-height:1.2; margin:22px 0 6px; letter-spacing:-.01em}
.ob .lead{color:var(--muted); margin:0 0 18px; font-size:.95rem}
.pick{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pick button{border:2px solid var(--line); background:var(--surface); border-radius:14px; padding:22px 10px; font-size:1.1rem; font-weight:700}
.pick button[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); background:var(--ok-soft)}
.obField{margin-top:14px}
.obField label{display:block; font-weight:600; font-size:.95rem}
.obField .help{display:block; font-size:.82rem; color:var(--muted); font-weight:400; margin:2px 0 6px}
.obField input[type=date], .obField select{width:100%; padding:10px 12px}
.obField input[type=number]{width:100%; text-align:left; padding:10px 12px}
.calc{margin-top:18px; padding:14px; border-radius:12px; background:var(--surface); border:1px solid var(--line)}
.calc b{font-size:1.6rem; font-weight:800; display:block; line-height:1.1}
.calc span{color:var(--muted); font-size:.86rem}
.obErr{color:var(--warn); font-size:.88rem; margin:12px 0 0; min-height:1.2em}
.obNav{display:flex; gap:10px; margin-top:22px}
.obNav button{flex:1; padding:14px; border-radius:12px; font-weight:700; border:1px solid var(--line); background:transparent; color:var(--muted)}
.obNav button.next{flex:2; border:0; background:var(--accent); color:var(--accent-ink)}
.sumList{list-style:none; margin:0; padding:0}
.sumList li{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--line); font-size:.93rem}
.sumList li:first-child{border-top:0}
.sumList li span:last-child{font-weight:600; text-align:right}

/* Nav */
nav.tabs{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:5}
nav.tabs div{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0; background:none; padding:8px 2px 9px; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-size:.7rem; font-weight:600; position:relative}
nav.tabs svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"]::before{content:""; position:absolute; top:0; left:28%; right:28%; height:3px; border-radius:0 0 3px 3px; background:var(--accent)}

.toast{position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom)); transform:translate(-50%, 10px); max-width:calc(100% - 32px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:.9rem; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:9; text-align:center}
.toast.show{opacity:1; transform:translate(-50%, 0)}

.loading{padding:60px 0; text-align:center; color:var(--muted)}
/* iPhone: 16px altı yazı alanlarına dokununca sayfa yakınlaşmasın */
@supports (-webkit-touch-callout: none){
  input, select, textarea{font-size:16px !important}
}
.wrap{padding-top:calc(20px + env(safe-area-inset-top))}
.install{display:flex; gap:10px; align-items:flex-start; background:var(--surface); border:1px solid var(--accent); border-radius:12px; padding:12px; margin-top:14px; font-size:.88rem}
.install .t{display:block; margin-bottom:2px}
.install button{margin-left:auto; border:0; background:none; color:var(--muted); font-size:1.2rem; line-height:1; padding:0 2px}
.install svg{width:15px; height:15px; vertical-align:-2px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
@media (max-width:360px){
  .row{grid-template-columns:36px 1fr auto; gap:9px}
  .sky{width:36px; height:36px}
  .plus{padding:0 10px}
  nav.tabs button{font-size:.64rem}
}

/* ---------- Namaz vakitleri (çevrimdışı) ----------
   Diyanet'e yakın hesap: imsak 18°, yatsı 17°, ikindi asr-ı evvel,
   temkin: güneş −7, öğle +5, ikindi +4, akşam +7 dk. */
var PT = (function(){
  var D2R = Math.PI/180;
  function sin(d){return Math.sin(d*D2R);} function cos(d){return Math.cos(d*D2R);} function tan(d){return Math.tan(d*D2R);}
  function asin(x){return Math.asin(x)/D2R;} function acos(x){return Math.acos(Math.max(-1,Math.min(1,x)))/D2R;} function atan2(y,x){return Math.atan2(y,x)/D2R;}
  function acot(x){return Math.atan(1/x)/D2R;}
  function fix(a,b){a=a-b*Math.floor(a/b);return a<0?a+b:a;}
  function julian(y,m,d){ if(m<=2){y-=1;m+=12;} var A=Math.floor(y/100),B=2-A+Math.floor(A/4); return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
  function sunPos(jd){
    var D=jd-2451545.0, g=fix(357.529+0.98560028*D,360), q=fix(280.459+0.98564736*D,360);
    var L=fix(q+1.915*sin(g)+0.020*sin(2*g),360), e=23.439-0.00000036*D;
    var RA=atan2(cos(e)*sin(L),cos(L))/15;
    return {decl:asin(sin(e)*sin(L)), eqt:q/15-fix(RA,24)};
  }
  function times(date, lat, lng){
    var y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
    var tz = -new Date(y,m-1,d,12).getTimezoneOffset()/60;
    var jd = julian(y,m,d) - lng/(15*24);
    function mid(t){ return fix(12 - sunPos(jd+t).eqt, 24); }
    function angleTime(angle,t,ccw){
      var p=sunPos(jd+t), noon=mid(t);
      var T=acos((-sin(angle)-sin(p.decl)*sin(lat))/(cos(p.decl)*cos(lat)))/15;
      return noon+(ccw?-T:T);
    }
    function asr(t){ var p=sunPos(jd+t); var a=-acot(1+tan(Math.abs(lat-p.decl))); return angleTime(a,t,false); }
    var h={fajr:5,sunrise:6,dhuhr:12,asr:13,sunset:18,isha:18};
    for(var i=0;i<2;i++){
      h={fajr:angleTime(18,h.fajr/24,true), sunrise:angleTime(0.833,h.sunrise/24,true), dhuhr:mid(h.dhuhr/24),
         asr:asr(h.asr/24), sunset:angleTime(0.833,h.sunset/24,false), isha:angleTime(17,h.isha/24,false)};
    }
    var adj={fajr:0,sunrise:-7,dhuhr:5,asr:4,sunset:7,isha:0}, out={};
    Object.keys(h).forEach(function(k){
      var mins=Math.round((h[k]+tz-lng/15)*60+adj[k]);
      out[k]=new Date(y,m-1,d,0,mins,0,0);
    });
    return out;
  }
  return {times:times};
})();

  function streaks(units){
    var t = todayIso(), cur = 0, d = metOn(t,units) ? t : shiftIso(t,-1);
    while(metOn(d,units)){ cur++; d = shiftIso(d,-1); }
    var met = Object.keys(state.log).filter(function(x){ return metOn(x,units); }).sort();
    var best = 0, run = 0, prev = null;
    met.forEach(function(x){ run = (prev && daysBetween(prev,x)===1) ? run+1 : 1; if(run>best) best=run; prev=x; });
    return {cur:cur, best:Math.max(best,cur), metToday:metOn(t,units), metDays:met.length};
  }
  function sumLog(obj, pred){ var s=0; Object.keys(obj).forEach(function(d){ if(pred(d)) s += Number(obj[d])||0; }); return s; }

  function kerahatWindows(date){
    var t = dayTimes(date), M = 60000;
    return [
      {from:t.sunrise, to:new Date(+t.sunrise + KERAHAT_MIN*M), why:"Güneş doğuyor"},
      {from:new Date(+t.dhuhr - KERAHAT_MIN*M), to:t.dhuhr, why:"Güneş tepede (istiva)"},
      {from:new Date(+t.sunset - KERAHAT_MIN*M), to:t.sunset, why:"Güneş batıyor"}
    ];
  }
  function kerahatNow(){
    var now = new Date(), w = kerahatWindows(now);
    for(var i=0;i<w.length;i++){ if(now >= w[i].from && now < w[i].to) return {inside:true, win:w[i], mins:(w[i].to-now)/60000}; }
    for(var j=0;j<w.length;j++){ if(now < w[j].from) return {inside:false, win:w[j], mins:(w[j].from-now)/60000}; }
    var tm = new Date(now); tm.setDate(tm.getDate()+1);
    var nw = kerahatWindows(tm)[0];
    return {inside:false, win:nw, mins:(nw.from-now)/60000};
  }
  function vakitStrip(){
    var k = kerahatNow();
    if(k.inside){
      return '<button class="vakit warn" data-act="go" data-v="rehber"><i class="dot"></i><span><b>Kerahat vakti, kaza kılınmaz</b><br>'+hm(k.win.from)+'–'+hm(k.win.to)+' · '+k.win.why+'</span><span class="r">'+fmtMins(k.mins)+' kaldı</span></button>';

    } else {

    fetch(SURUM_URL, {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; })

      .then(function(j){

  function vEntry(v, d){ var e = v.log[d]; return e && typeof e==="object" ? e : {read:false, count:0, done:false}; }
  function vSetEntry(v, d, e){ v.log[d] = e; }
  function vDoneDays(v){ var n=0; Object.keys(v.log).forEach(function(d){ if(v.log[d] && v.log[d].done) n++; }); return n; }
  function vStreak(v){
    var t = todayIso(), d = (v.log[t] && v.log[t].done) ? t : shiftIso(t,-1), n = 0;
    while(v.log[d] && v.log[d].done && d >= v.start){ n++; d = shiftIso(d,-1); }
    return n;
  }
  function vProgress(v){ return v.missRule==="bastan" ? vStreak(v) : vDoneDays(v); }
  function vComplete(v){ return vProgress(v) >= v.days; }

    if(v.missRule!=="bastan" || vComplete(v)) return false;
    var y = yesterdayIso();

    return vDoneDays(v) > 0 && vStreak(v)===0;

  function todayTally(s){
    var t = todayIso(), d = state.dlog[t] || {}, oru = Number(state.olog[t])||0, h = '<div class="tally">', any = false;
    s.keys.forEach(function(x){
      var n = Number(d[x.k])||0;
      if(!n) return;
      any = true;
      h += '<span><i class="'+("fill-"+x.k)+'"></i>'+x.n+' <b class="num">'+n+'</b></span>';
    });
    var bilinmeyen = Math.max(0, (Number(state.log[t])||0) - Object.keys(d).reduce(function(a,k){ return a + (Number(d[k])||0); }, 0));
    if(bilinmeyen){ any = true; h += '<span><i style="background:var(--muted)"></i>Vakit <b class="num">'+bilinmeyen+'</b></span>'; }
    if(oru){ any = true; h += '<span><i class="fill-oruc"></i>Oruç <b class="num">'+oru+'</b></span>'; }
    var zk = Number(state.zikir.log[t])||0;
    if(zk){ any = true; h += '<span><i style="background:var(--accent)"></i>Zikir <b class="num">'+fmtInt(zk)+'</b></span>'; }
    state.virds.forEach(function(v){ if(v.log[t] && v.log[t].done){ any = true; h += '<span><i style="background:var(--accent)"></i>'+esc(v.name)+' <b>✓</b></span>'; } });
    if(!any) h += '<span class="none">Bugün henüz bir şey işlenmedi. Bir vakit kaza kılınca burada görünür.</span>';
    h += '</div>';
    var st = streaks(s.targetUnits);
    if(st.cur > 1) h += '<p class="small" style="margin-top:10px">'+st.cur+' gündür hedefini tutturuyorsun.</p>';
    return h;
  }
  function viewStats(){
    var s = stats(), st = streaks(s.targetUnits), t = todayIso(), h = "";
    h += '<h2>Seri</h2><div class="panel">';
    h += '<div class="streak"><div class="big num">'+st.cur+'</div><div><div><b>gün üst üste</b> hedef tuttu</div><div class="lbl">En uzun seri: '+st.best+' gün · Hedef: günde '+s.targetUnits+' vakit</div></div></div>';
    var dow = (new Date().getDay()+6)%7, ws = shiftIso(t, -dow);
    h += '<div class="week">';
    for(var i=0;i<7;i++){
      var d = shiftIso(ws,i), v = Number(state.log[d])||0;
      var c = metOn(d,s.targetUnits) ? "met" : (v>0 ? "part" : "");
      if(d===t) c += " now";
      h += '<div><i class="'+c+'" title="'+fmtDate(d)+': '+v+' vakit"></i><em>'+DAYS[i]+'</em></div>';
    }
    h += '</div>';
    if(!st.metToday && s.targetUnits>0) h += '<p class="small">Bugün '+Math.max(0,s.targetUnits-s.today)+' vakit daha kılarsan seri '+(st.cur+1)+' güne çıkar.</p>';
    h += '</div>';

    var weekSum = sumLog(state.log, function(d){ return d>=ws && d<=t; });
    var mKey = t.slice(0,7), monthSum = sumLog(state.log, function(d){ return d.slice(0,7)===mKey; });
    var allSum = sumLog(state.log, function(){ return true; });
    h += '<h2>Özet</h2><div class="tiles">';
    h += '<div class="tile"><b class="num">'+fmtInt(weekSum)+'</b><span>bu hafta kılınan vakit</span></div>';
    h += '<div class="tile"><b class="num">'+fmtInt(monthSum)+'</b><span>'+MONTHS[+t.slice(5,7)-1]+' ayında</span></div>';
    h += '<div class="tile"><b class="num">'+fmtInt(allSum)+'</b><span>uygulamada işlenen toplam</span></div>';
    h += '<div class="tile"><b class="num">'+st.metDays+'</b><span>hedefin tutulduğu gün</span></div>';
    if(state.oruc.initial>0) h += '<div class="tile"><b class="num">'+fmtInt(state.oruc.done)+'</b><span>kaza orucu tutuldu, '+fmtInt(orucRem())+' kaldı</span></div>';
    h += '</div>';

    // son 14 gün
    var max = s.targetUnits || 1, days = [];
    for(var j=13;j>=0;j--){ var dd = shiftIso(t,-j); var vv = Number(state.log[dd])||0; days.push([dd,vv]); if(vv>max) max=vv; }
    h += '<h2>Son 14 gün</h2><div class="panel"><div class="bars">';
    days.forEach(function(p){
      var ht = p[1] ? Math.max(4, p[1]/max*58) : 2;
      var c = !p[1] ? "zero" : (metOn(p[0],s.targetUnits) ? "met" : "part");
      h += '<div title="'+fmtDate(p[0])+': '+p[1]+' vakit"><span class="'+c+'" style="height:'+ht.toFixed(0)+'px"></span><em>'+(+p[0].slice(8))+'</em></div>';
    });
    h += '</div><p class="small">Koyu sütunlar hedefin tutulduğu günler.</p></div>';

    // aylık
    var months = [], mmax = 1, base = new Date(); base.setDate(1);
    for(var k=11;k>=0;k--){
      var md = new Date(base.getFullYear(), base.getMonth()-k, 1);
      var key = md.getFullYear()+"-"+pad(md.getMonth()+1);
      var sum = sumLog(state.log, function(d){ return d.slice(0,7)===key; });
      months.push([md.getMonth(), sum]); if(sum>mmax) mmax=sum;
    }
    h += '<h2>Son 12 ay</h2><div class="panel"><div class="bars">';
    months.forEach(function(p){
      var ht = p[1] ? Math.max(4, p[1]/mmax*58) : 2;
      h += '<div title="'+MONTHS[p[0]]+': '+p[1]+' vakit"><span class="'+(p[1]?'met':'zero')+'" style="height:'+ht.toFixed(0)+'px"></span><em>'+MON3[p[0]]+'</em></div>';
    });
    h += '</div>';
    if(allSum) h += '<p class="small">En yüksek ay: '+fmtInt(mmax)+' vakit</p>';
    h += '</div>';

    // aşamalar
    var nextM = null;
    MILES.forEach(function(m){ if(nextM===null && s.pct < m) nextM = m; });
    h += '<h2>Aşamalar</h2><div class="panel"><ul class="miles">';
    MILES.forEach(function(m){
      var need = Math.ceil(s.totalInit*m/100) - (s.totalInit - s.totalRem);
      var cls = s.pct >= m ? "got" : (m===nextM ? "next" : "");
      var right = s.pct >= m ? "tamam" : (fmtInt(need)+" vakit"+(s.targetUnits ? ", ~"+fmtDuration(need/s.targetUnits) : ""));
      h += '<li class="'+cls+'"><span class="m">%'+m+'</span><span>'+(m===100?"Borç bitti":(m===50?"Yarı yol":"%"+m+" kılındı"))+'</span><small class="num">'+right+'</small></li>';
    });
    h += '</ul></div>';
    return h;
  }

  /* ---------- olaylar ---------- */
  var focusAfter = null;
  function go(v, focusId){
    if(v===view && !focusId){ window.scrollTo(0,0); return; }
    view = v; focusAfter = focusId || null; importError = "";
    render(); window.scrollTo(0,0);
    if(focusId){ var el = document.getElementById(focusId); if(el){ el.scrollIntoView({block:"center"}); el.focus(); } focusAfter = null; }
  }
  tabs.addEventListener("click", function(e){
    var b = e.target.closest("[data-view]"); if(b) go(b.getAttribute("data-view"));
  });

  app.addEventListener("click", function(e){
    var b = e.target.closest("[data-act]");
    if(!b || b.disabled || !state) return;
    var a = b.getAttribute("data-act"), k = b.getAttribute("data-k");
    switch(a){
      case "plus": plus(k); break;
      case "minus": minus(k); break;
      case "oplus": orucPlus(); break;
      case "ominus": orucMinus(); break;
      case "day": wholeDay(); break;
      case "reset": resetProgress(b); break;
      case "go": go(b.getAttribute("data-v"), b.getAttribute("data-focus")); break;
      case "recalc":
        var d = computeDebt(state.setup);
        KEYS.forEach(function(x){ state.initial[x.k] = d; if(state.done[x.k] > d) state.done[x.k] = d; });
        change(); toast("Borç yeniden hesaplandı"); break;
      case "export": exportFile(); break;
      case "share": shareBackup(); break;
      case "import": openFile(); break;
      case "paste": pasteOpen = !pasteOpen; render(); if(pasteOpen){ var pb=document.getElementById("pasteBox"); if(pb) pb.focus(); } break;
      case "pasteGo": var box = document.getElementById("pasteBox"); if(box && box.value.trim()){ pasteOpen=false; tryImport(box.value); } break;
      case "iok":
        if(pendingImport){ state = pendingImport.data; pendingImport = null; saved = false; persist(); if(!state.setupDone) openSetup(); render(); toast("Yedek yüklendi"); }
        break;
      case "icancel": pendingImport = null; render(); break;
      case "smode": sessForm.mode = b.getAttribute("data-m"); render(); break;
      case "skey": sessForm.key = k; sessForm.count = Math.max(1, Math.min(sessForm.count, remaining(k) || 1)); render(); break;
      case "step":
        var id = b.getAttribute("data-id"), dd = Number(b.getAttribute("data-d"));
        if(id==="obTarget"){ ob.target = Math.max(1, Math.min(ob.targetMode==="vakit"?50:10, ob.target+dd)); render(); break; }
        if(id==="days") sessForm.days = Math.max(1, Math.min(10, sessForm.days+dd));
        else sessForm.count = Math.max(1, Math.min(20, sessForm.count+dd));
        render(); break;
      case "sstart": startSession(); break;
      case "obg": ob.gender = b.getAttribute("data-v"); ob.err = ""; render(); break;
      case "obtmode":
        var om = b.getAttribute("data-m"), operc = obKeys().length;
        if(om!==ob.targetMode){
          ob.target = om==="vakit" ? Math.min(50, ob.target*operc) : Math.max(1, Math.round(ob.target/operc));
          ob.targetMode = om;
        }
        render(); break;
      case "obnext": obNext(); break;
      case "obback": obBack(); break;
      case "obcancel": ob = null; view = "ayarlar"; render(); break;
      case "setup": openSetup(); render(); window.scrollTo(0,0); break;
      case "tmode":
        var nm2 = b.getAttribute("data-m");
        if(nm2!==state.targetMode){
          var per2 = activeKeys().length;
          state.target = nm2==="vakit" ? Math.min(200, state.target*per2) : Math.max(1, Math.round(state.target/per2));
          state.targetMode = nm2; change();
        }
        break;
      case "updgo": if(upd){ updState = {durum:"indiriliyor", pct:0, mesaj:""}; render(); nat("downloadUpdate", upd.apk); } break;
      case "updskip": if(upd){ state.update.skip = Number(upd.code)||0; upd = null; updState = null; persist(); render(); toast("Bu sürüm atlandı"); } break;
      case "updcheck": toast("Kontrol ediliyor…"); checkUpdate(true); break;
      case "hideInstall": installHidden = true; try{ localStorage.setItem("kaza-kurulum-ipucu","1"); }catch(e){} render(); break;
      case "ztab": zTab = b.getAttribute("data-m"); zArmed = false; vArmed = false; zLib = false; render(); window.scrollTo(0,0); break;
      case "vopen": vOpen = b.getAttribute("data-v"); vArmed = false; render(); window.scrollTo(0,0); break;
      case "vback": vOpen = null; vArmed = false; render(); window.scrollTo(0,0); break;
      case "vadd":
        var pk = b.getAttribute("data-p"), pr = null;
        VIRD_PRESETS.forEach(function(x){ if(x.key===pk) pr = x; });
        if(pr) vAdd(pr);
        render(); window.scrollTo(0,0); break;
      case "vcancel": vForm = null; render(); break;
      case "vcreate":
        var nm = (document.getElementById("vfName")||{}).value, zk2 = (document.getElementById("vfZikir")||{}).value;
        vForm.name = (nm||"").trim().slice(0,40) || "Vird";
        vForm.cname = (zk2||"").trim().slice(0,60) || "Zikir";
        state.virds.push(vForm); vOpen = vForm.id; vForm = null; persist(); render(); window.scrollTo(0,0);
        toast("Vird oluşturuldu"); break;
      case "vtap": var vt = virdById(vOpen); if(vt) vTick(vt); break;
      case "vread": var vr = virdById(vOpen); if(vr) vRead(vr); break;
      case "vfill": var vf = virdById(vOpen); if(vf) vFill(vf); break;
      case "vundo": var vu = virdById(vOpen); if(vu) vUndo(vu); break;
      case "vkeep": var vk = virdById(vOpen); if(vk){ vk.missRule = "devam"; persist(); render(); } break;
      case "vrestart": var vs = virdById(vOpen); if(vs) vRestart(vs); break;
      case "vdel":
        if(!vArmed){ vArmed = true; render(); setTimeout(function(){ if(vArmed){ vArmed=false; render(); } }, 4000); break; }
        vArmed = false;
        state.virds = state.virds.filter(function(x){ return x.id!==vOpen; });
        vOpen = null; persist(); render(); toast("Vird kaldırıldı"); break;
      case "ztap": zikirTap(); break;
      case "zundo": zikirUndo(); break;
      case "zreset": zikirReset(); break;
      case "zsel": zUse(b.getAttribute("data-z")); zArmed = false; persist(); render(); break;
      case "zlib": zLib = true; render(); window.scrollTo(0,0); break;
      case "zliboff": zLib = false; render(); window.scrollTo(0,0); break;
      case "zpick": zUse(b.getAttribute("data-z")); zLib = false; zArmed = false; persist(); render(); window.scrollTo(0,0); break;
      case "ztarget": state.zikir.targets[state.zikir.active] = Number(b.getAttribute("data-v")); persist(); render(); break;
      case "zadd":
        var zi = document.getElementById("zNew"), nm = zi ? zi.value.trim().slice(0,60) : "";
        if(!nm){ if(zi) zi.focus(); break; }
        if(state.zikir.custom.length >= 30){ toast("En fazla 30 zikir eklenebilir"); break; }
        var nid = "c" + Date.now().toString(36);
        state.zikir.custom.push({id:nid, n:nm}); zUse(nid);
        persist(); render(); toast("Zikir eklendi"); break;
      case "zdel":
        var cid = state.zikir.active;
        state.zikir.custom = state.zikir.custom.filter(function(c){ return c.id!==cid; });
        delete state.zikir.counts[cid]; delete state.zikir.targets[cid];
        state.zikir.active = "tesbihat"; persist(); render(); toast("Zikir kaldırıldı"); break;
      case "stap": sessTap(); break;
      case "sskip": sessSkip(); break;
      case "send": finishSession(); break;
      case "snew": sess = null; saveSess(); render(); break;
      case "sgeri": go("takip"); break;
    }
  });

  app.addEventListener("keydown", function(e){
    if(e.target && e.target.id==="zNew" && e.key==="Enter"){ e.preventDefault(); var b = app.querySelector('[data-act="zadd"]'); if(b) b.click(); }
  });
  app.addEventListener("input", function(e){ if(view==="kurulum") obInput(e.target); });
  app.addEventListener("change", function(e){
    var t = e.target; if(!state) return;
    if(view==="kurulum"){ obInput(e.target); return; }
    if(t.id==="target"){ var v = Math.round(Number(t.value)), mx = state.targetMode==="vakit" ? 200 : 20; if(v>=1 && v<=mx){ state.target = v; change(); } else render(); }
    else if(t.id==="vitir"){ state.setup.vitir = t.checked; change(); }
    else if(t.id==="city"){ state.city = t.value; change(); }
    else if(t.id==="updOn"){ state.update.check = t.checked; if(t.checked){ state.update.lastCheck = ""; change(); checkUpdate(false); } else { upd = null; updState = null; change(); } }
    else if(t.id==="vakitOn"){ state.vakitRemind.on = t.checked; change(); syncVakitNative(); toast(t.checked ? "Vakit bildirimleri açıldı" : "Vakit bildirimleri kapatıldı"); }
    else if(t.id==="vakitOffset"){ state.vakitRemind.offset = Math.round(Number(t.value))||30; change(); syncVakitNative(); }
    else if(t.hasAttribute("data-vakit")){ state.vakitRemind.keys[t.getAttribute("data-vakit")] = t.checked; change(); syncVakitNative(); }
    else if(t.id==="zvib"){ state.zikir.vibrate = t.checked; persist(); }
    else if(t.id==="vRemind"){ var v1 = virdById(vOpen); if(v1){ v1.remind = t.checked; persist(); render(); toast(t.checked ? "Hatırlatma kuruldu" : "Hatırlatma kapatıldı"); } }
    else if(t.id==="vMiss"){ var v2 = virdById(vOpen); if(v2){ v2.missRule = t.value; persist(); render(); } }
    else if(t.id==="vfCount"){ if(vForm) vForm.ctarget = Math.max(1, Math.min(10000, Math.round(Number(t.value)||100))); }
    else if(t.id==="vfDays"){ if(vForm) vForm.days = Math.max(1, Math.min(365, Math.round(Number(t.value)||40))); }
    else if(t.id==="vfWindow"){ if(vForm){ vForm.window = t.value; } }
    else if(t.id==="zvol"){ state.zikir.volume = t.checked; persist(); render(); }
    else if(t.id==="start" || t.id==="end"){ if(t.value){ state.setup[t.id] = t.value; change(); } }
    else if(t.id==="hayiz"){ var hz = Number(t.value); if(hz>=0 && hz<=15){ state.setup.hayiz = hz; change(); } else render(); }
    else if(t.id==="lohusa"){ var lh = Math.round(Number(t.value)); if(lh>=0 && isFinite(lh)){ state.setup.lohusa = lh; change(); } else render(); }
    else if(t.id==="gender"){ state.setup.gender = t.value; change(); toast("Toplam borcu güncellemek için 'Borcu yeniden hesapla'ya dokun"); }
    else if(t.id==="remOn"){ setReminder(t.checked, rem.hour, rem.minute); }
    else if(t.id==="remTime"){
      var p = String(t.value).split(":");
      if(p.length>=2){ rem.hour = +p[0]; rem.minute = +p[1]; if(rem.enabled) setReminder(true, rem.hour, rem.minute); else render(); }
    }
    else if(t.id==="orucInit"){
      var oi = Math.round(Number(t.value));
      if(oi>=0 && isFinite(oi)){ state.oruc.initial = oi; if(state.oruc.done>oi) state.oruc.done = oi; change(); } else render();
    }
    else if(t.id==="orucDone"){
      var od = Math.round(Number(t.value));
      if(od>=0 && isFinite(od)){ state.oruc.done = Math.min(od, state.oruc.initial); change(); } else render();
    }
    else if(t.hasAttribute("data-init")){
      var key = t.getAttribute("data-init"), n = Math.round(Number(t.value));
      if(n>=0 && isFinite(n)){ state.initial[key] = n; if(state.done[key] > n) state.done[key] = n; change(); } else render();
    }
    else if(t.hasAttribute("data-done")){
      var key2 = t.getAttribute("data-done"), n2 = Math.round(Number(t.value));
      if(n2>=0 && isFinite(n2)){ state.done[key2] = Math.min(n2, Number(state.initial[key2])||0); change(); } else render();
    }
  });

  /* Dakikada bir: kerahat şeridi ve gün değişimi */
  var lastDay = todayIso();
  setInterval(function(){
    if(!state) return;
    var ae = document.activeElement, typing = ae && (ae.tagName==="INPUT" || ae.tagName==="TEXTAREA" || ae.tagName==="SELECT");
    if(typing) return;
    if(todayIso()!==lastDay){ lastDay = todayIso(); syncNative(); }
    if(view==="takip" || view==="oturum" || view==="rehber" || view==="kazaoturum") render();
  }, 30000);
  document.addEventListener("visibilitychange", function(){ if(!state) return; if(document.hidden){ syncZikirNative(); return; }
    if(!updBusy && state.update.check) checkUpdate(false); lastVol = null; lastAwake = null; loadReminder(); syncNative(); render(); });

  window.kazaBack = function(){
    if(view==="kurulum"){
      if(ob && ob.step>0){ obBack(); return true; }
      if(ob && ob.again){ ob = null; view = "ayarlar"; render(); return true; }
      return false;
    }
    if(view==="kazaoturum"){ go("takip"); return true; }
    if(view==="oturum" && zTab==="zikir" && zLib){ zLib = false; render(); return true; }
    if(view==="oturum" && zTab==="vird" && (vOpen || vForm)){ vOpen = null; vForm = null; render(); return true; }
    if(view!=="takip"){ go("takip"); return true; }
    return false;
  };

  load();

  if(!N && navigator.storage && navigator.storage.persist){ try{ navigator.storage.persist().catch(function(){}); }catch(e){} }
  if(!N && "serviceWorker" in navigator && location.protocol==="https:"){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
