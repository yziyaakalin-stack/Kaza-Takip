plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ziya.kazatakip'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ziya.kazatakip'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '1.9'
    }

    // Sabit imza: her derleme aynı anahtarla imzalanır, böylece
    // yeni sürüm eski sürümün üzerine kurulur ve kayıtlar korunur.
    signingConfigs {
        sabit {
            storeFile file('kaza-imza.p12')
            storeType 'pkcs12'
            storePassword 'kazatakip'
            keyAlias 'kaza'
            keyPassword 'kazatakip'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sabit
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.sabit
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
