name: APK oluştur

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KazaTakibi.apk
          gh release create "surum-${{ github.run_number }}" KazaTakibi.apk \
            --title "Kaza Takibi ${{ github.run_number }}" \
            --notes "Telefondan KazaTakibi.apk dosyasına dokunup indir ve kur. Güncellemede kayıtların korunur."

      - uses: actions/upload-artifact@v4
        with:
          name: KazaTakibi-apk
          path: KazaTakibi.apk
