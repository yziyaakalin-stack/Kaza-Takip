name: APK ve web sürümü oluştur

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KazaTakibi.apk
          VC=$(grep -m1 versionCode app/build.gradle | tr -dc '0-9')
          VN=$(grep -m1 versionName app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          NOTES=$(printf 'Telefondan KazaTakibi.apk dosyasına dokunup indir ve kur. Güncellemede kayıtların korunur.\n\nsurum:{"code": %s, "name": "%s", "apk": "https://github.com/yziyaakalin-stack/Kaza-Takip/releases/latest/download/KazaTakibi.apk"}' "$VC" "$VN")
          gh release create "surum-${{ github.run_number }}" KazaTakibi.apk \
            --title "Kaza Takibi $VN" \
            --notes "$NOTES"

      - uses: actions/upload-artifact@v4
        with:
          name: KazaTakibi-apk
          path: KazaTakibi.apk

  # iPhone ve tarayıcı için aynı arayüz GitHub Pages'te yayınlanır
  web-hazirla:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Web dosyalarını topla
        run: |
          mkdir -p _site
          cp app/src/main/assets/index.html _site/
          cp web/manifest.webmanifest web/sw.js web/icon-*.png _site/
          # her yayında önbellek sürümü değişsin ki telefonlar yeni sürümü alsın
          sed -i "s/kaza-web-v1/kaza-web-${GITHUB_SHA::8}/" _site/sw.js
          # uygulamanın yeni sürümü görmesi için sürüm dosyası
          VC=$(grep -m1 versionCode app/build.gradle | tr -dc '0-9')
          VN=$(grep -m1 versionName app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          printf '{"code": %s, "name": "%s", "apk": "https://github.com/yziyaakalin-stack/Kaza-Takip/releases/latest/download/KazaTakibi.apk"}\n' "$VC" "$VN" > _site/surum.json
          cat _site/surum.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  web-yayinla:
    needs: web-hazirla
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
